name: IslandClock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  IslandClock:
    type: application
    platform: iOS
    sources:
      - path: FocusApp.swift
      - path: FocusView.swift
      - path: FocusAttributes.swift
      - path: Assets.xcassets
    info:
      path: AppInfo.plist
      properties:
        CFBundleDisplayName: Focus
        NSSupportsLiveActivities: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.islandclock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ClockWidget
        embed: true
  ClockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusWidgetBundle.swift
      - path: FocusLiveActivity.swift
      - path: FocusAttributes.swift
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Focus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.islandclock.widget
