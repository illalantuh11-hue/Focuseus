name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Add app icon
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cp icon.png Assets.xcassets/AppIcon.appiconset/icon.png
          echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project IslandClock.xcodeproj -scheme IslandClock \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IslandClock.app Payload/
          zip -r IslandClock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IslandClock-ipa
          path: IslandClock.ipa
